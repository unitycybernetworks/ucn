<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="../logo/ucn.jpeg">
    <title>Feedback | Unity Cyber Netw⚙️rks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <div class="container">
        <h1>Rate IT Professional Help</h1>
        <form action="https://formsubmit.co/unitycybernetworks@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Feedback submitted">
                <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="https://unitycybernetworks.github.io/ucn/feedback/thank-you">
                        <input type="hidden" name="_template" value="table">
         
            <label for="services">Rate your experience:</label>
            <select name="rate">
                <option value="excellent">Excellent</option>
                <option value="very good">Very Good</option>
                <option value="good">Good</option>
                <option value="fair">Fair</option>
                <option value="poor">Poor</option>
            </select>

            <label for="feedback">Your Feedback:</label>
            <textarea name="feedback" maxlength="1500" placeholder="Write your feedback here..."></textarea>

            <button type="submit">Submit Feedback</button>
        </form>
    </div>
    
</body>
</html>
